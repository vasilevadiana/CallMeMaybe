[project]
name = "my-callmemaybe"
version = "0.1.0"
description = "CallMeMaybe project for 42Heilbronn"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "silent"
